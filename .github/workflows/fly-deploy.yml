name: Deploy to Fly.io

on:
  pull_request:
  schedule:
    - cron: '43 5 * * 2'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Verify application before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.18'
      - run: pip install --require-hashes -r backend/requirements.txt
      - name: Check API routing without external services
        working-directory: backend
        run: |
          python - <<'PYTEST'
          from importlib.metadata import version
          from pathlib import Path
          from pip._vendor.packaging.requirements import Requirement
          for line in Path("requirements.in").read_text().splitlines():
              if line.strip():
                  req = Requirement(line)
                  assert version(req.name) in req.specifier, f"Regenerate requirements.txt for {req}"
          from starlette.testclient import TestClient
          from backend import app
          with TestClient(app) as client:
              assert client.get('/docs').status_code == 200
              assert '/events' in client.get('/openapi.json').json()['paths']
          PYTEST
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci && npm run build
        working-directory: frontend

  deploy-backend:
    needs: verify
    if: github.event_name != 'pull_request'
    name: Deploy Backend to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy Backend to Fly.io
        run: flyctl deploy --remote-only --no-cache
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    needs: verify
    if: github.event_name != 'pull_request'
    name: Deploy Frontend to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy Frontend to Fly.io
        run: flyctl deploy --remote-only --no-cache
        working-directory: ./frontend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}